<div class="feed">
  <div *ngIf="loading" class="state"><i class="fa fa-spinner fa-spin" aria-hidden="true"></i> {{ 'social.loading' | i18next }}</div>
  <div *ngIf="!loading && error" class="state error">{{ error | i18next }} <button type="button" (click)="loadFeed(true)">{{ 'social.retry' | i18next }}</button></div>
  <div *ngIf="!loading && !moments.length && !error" class="state">{{ 'social.emptyMoment' | i18next }}</div>

  <article class="moment-card" *ngFor="let m of moments">
    <header class="moment-head">
      <span class="avatar" *ngIf="!m?.userResponseMoment?.profilePictureUrl || m?.userResponseMoment?.profilePictureUrl === 'null'">{{ avatarText(m) }}</span>
      <img class="avatar-img" *ngIf="m?.userResponseMoment?.profilePictureUrl && m?.userResponseMoment?.profilePictureUrl !== 'null'" [src]="m.userResponseMoment.profilePictureUrl" alt="" />
      <div class="head-text">
        <strong>{{ userName(m) }}</strong>
        <small>{{ m.createdAt | date: 'short' }}</small>
      </div>
    </header>

    <p class="moment-content" *ngIf="m.content || m.description">{{ m.content || m.description }}</p>

    <div class="moment-media" *ngIf="images(m).length">
      <img *ngFor="let att of images(m).slice(0, 4)" [src]="att.attachmentUrl" alt="" loading="lazy" />
    </div>
    <div class="moment-media" *ngIf="videos(m).length">
      <video *ngFor="let att of videos(m).slice(0, 2)" controls preload="metadata" [src]="att.attachmentUrl"></video>
    </div>

    <footer class="moment-actions">
      <button type="button" [class.liked]="m.likedByMe" (click)="toggleLike(m)">
        <i class="fa" [ngClass]="m.likedByMe ? 'fa-heart' : 'fa-heart-o'" aria-hidden="true"></i> {{ m.likeCount || 0 }}
      </button>
      <button type="button" (click)="toggleComments(m)">
        <i class="fa fa-comment-o" aria-hidden="true"></i> {{ (m.comments || []).length }}
      </button>
    </footer>

    <div class="comments" *ngIf="expandedComments[m._id]">
      <!--<div class="comment" *ngFor="let c of m.comments">
        <strong>{{ c.userName || c.firstName || ('social.unknownUser' | i18next) }}</strong>
        <span>{{ c.comment }}</span>
      </div>-->
      <div class="comment-box">
        <input [(ngModel)]="commentDrafts[m._id]" maxlength="255" [placeholder]="'social.writeComment' | i18next" (keyup.enter)="sendComment(m)" />
        <button type="button" (click)="sendComment(m)" [disabled]="sendingComment[m._id]">
          <i class="fa fa-paper-plane-o" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </article>

  <div class="load-more" *ngIf="!loading && moments.length">
    <button type="button" (click)="loadFeed(false)" [disabled]="loadingMore">
      {{ loadingMore ? ('social.loading' | i18next) : ('social.loadMore' | i18next) }}
    </button>
  </div>
</div>
